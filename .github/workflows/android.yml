
name: Build Detox Loud APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q DETOX_LOUD_1_00_Android_Project.zip

      - name: Build APK
        run: gradle -p DETOX_LOUD_1_00_Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Detox-Loud-1.00-debug-apk
          path: DETOX_LOUD_1_00_Android/app/build/outputs/apk/debug/app-debug.apk
